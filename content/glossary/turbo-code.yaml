id: turbo-code
term: Turbo code
plain_definition: A powerful code built from two simple encoders whose outputs are decoded together over several passes.
precise_meaning: 'CCSDS Turbo codes: nominal rates 1/2, 1/3, 1/4, 1/6; information block lengths 1784, 3568, 7136, 8920 bits; synchronized with longer, rate-dependent markers in the coded symbol domain.'
layer: Synchronization and channel coding sublayer
