id: otar
term: OTAR
expansion: Over-The-Air Rekeying
plain_definition: Sending new traffic keys to a spacecraft over the link, protected by a master key.
precise_meaning: 'SDLS extended-procedure key management: session keys generated by the initiator are distributed to the recipient under master keys; optional if keys are preloaded.'
layer: Data link / key management
aliases:
- rekeying
example_usage: '''OTAR of the next session key is planned for Tuesday.'' (fictional)'
