id: security-association
term: Security association
expansion: Security association (SA)
plain_definition: The agreed keys, algorithms and counters both ends use to protect one direction of a channel.
precise_meaning: Simplex, stateful cryptographic session identified by an SPI; service fixed at creation (authentication, encryption or authenticated encryption); states Unkeyed, Keyed, Operational.
layer: Data link
aliases:
- SA
example_usage: '''Start SA-B before stopping SA-A.'' (fictional)'
related_terms:
- spi
- sdls
topics:
- security-associations-and-anti-replay
- key-management-and-rotation
