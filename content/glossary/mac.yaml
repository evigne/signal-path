id: mac
term: MAC
expansion: Message Authentication Code
plain_definition: A short tag computed with a secret key that proves a frame was not changed and came from a key holder.
precise_meaning: SDLS security trailer field computed over selected frame fields (never the OCF, error control or sync marker); 128 bits for CCSDS GCM.
layer: Data link
aliases:
- tag
- authentication code
example_usage: '''MAC failures: zero this pass.'' (fictional)'
