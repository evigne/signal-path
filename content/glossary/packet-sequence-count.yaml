id: packet-sequence-count
term: Packet Sequence Count
expansion: Packet Sequence Count
plain_definition: A running number that each application stamps on its packets so the ground can put them in order and notice missing ones.
precise_meaning: Bits 18–31 of the Space Packet primary header (14 bits), counted per APID, modulo 16,384. Telecommand packets may carry a Packet Name here instead.
layer: Network / packet layer
aliases:
- sequence count
- SSC
example_usage: '''APID 126 jumped from 1040 to 1042, one packet missing.'' (fictional)'
related_terms:
- apid
- space-packet
topics:
- space-packet-protocol
label: standard
sources:
