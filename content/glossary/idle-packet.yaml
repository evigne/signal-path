id: idle-packet
term: Idle Packet
expansion: Idle Packet
plain_definition: A filler packet with no useful data, sent to keep the data stream going when applications have nothing to send.
precise_meaning: A Space Packet with APID 11111111111 (all ones), no secondary header, and a project-specified idle pattern in its data field.
layer: Network / packet layer
aliases:
- fill packet
example_usage: '''Filter idle packets before counting APIDs.'' (fictional)'
related_terms:
- apid
- space-packet
topics:
- space-packet-protocol
label: standard
