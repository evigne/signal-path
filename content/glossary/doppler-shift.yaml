id: doppler-shift
term: Doppler shift
plain_definition: The change in received frequency caused by the spacecraft moving towards or away from the station.
precise_meaning: For Category A Earth-to-space links, CCSDS 401.0-B-32 cites shifts up to about ±80 kHz at 2 GHz and ±300 kHz at 7 GHz, larger than receiver lock-in ranges, which is why ground transmitters
  sweep and use predicted Doppler.
layer: Physical layer
