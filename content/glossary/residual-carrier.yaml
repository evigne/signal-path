id: residual-carrier
term: Residual carrier
expansion: Residual carrier
plain_definition: A modulation that leaves part of the pure carrier tone in the signal
  so the receiver can find and track it easily.
precise_meaning: Phase modulation that keeps a carrier component; CCSDS recommends
  it on Earth-to-space links and for low-rate telemetry.
layer: Physical
aliases:
- PCM/PM
example_usage: '''It is a residual-carrier link at 8 kbit/s.'' (fictional)'
related_terms:
- doppler-shift
topics:
