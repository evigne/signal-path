id: sdls
term: SDLS
expansion: Space Data Link Security Protocol
plain_definition: The CCSDS add-on that lets transfer frames be authenticated and/or encrypted.
precise_meaning: Security header (SPI, IV, sequence number, pad length) and trailer (MAC) inside TM, TC, AOS or USLP frames; layer 2 only (CCSDS 355.0-B-2).
layer: Data link
aliases:
- link security
example_usage: '''VC1 is SDLS-authenticated.'' (fictional)'
