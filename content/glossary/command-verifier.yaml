id: command-verifier
term: Command verifier
expansion: Command verifier
plain_definition: A check on telemetry that confirms a command has reached a stage,
  such as accepted or executed.
precise_meaning: 'In XTCE, one of eight verifier types: TransferredToRange, TransferredFromRange,
  Received, Accepted, Queued, Execution, Complete, Failed.'
