id: first-header-pointer
term: First Header Pointer
expansion: FHP
plain_definition: A field in each frame that says where the first new packet starts inside that frame.
precise_meaning: 'Bits 37–47 of the TM primary header: octet position of the first packet starting in the data field (first octet = 0); 11111111111 if no packet starts in the frame; 11111111110 for an Only
  Idle Data frame.'
layer: Data link layer
aliases:
- FHP
example_usage: '''FHP was all ones for three frames — one long packet spanning them.'' (fictional)'
related_terms:
