id: pn-ranging
term: PN ranging
expansion: Pseudo-noise ranging
plain_definition: Measuring distance to a spacecraft by timing a known code that goes up and comes back.
precise_meaning: Round-trip light time measured with a PN code (T4B for accuracy, T2B for fast acquisition), regenerative or transparent (CCSDS 414.1-B-3).
layer: Physical
aliases:
- ranging
example_usage: '''Ranging is on T4B for this pass.'' (fictional)'
related_terms:
- doppler-shift
topics:
- ranging-and-doppler
label: standard
