id: space-packet-header-decoder
title: Space Packet header decoder
tool: 2
level: core
est_minutes:
- 15
- 25
objectives:
- Decode every field of a Space Packet primary header from hex.
- Compute total packet length from the Packet Data Length field.
- Recognise idle packets, sequence-count gaps and length errors.
prerequisites:
- space-packet-protocol
fictional_input:
  description: Three synthetic packets on fictional APIDs, followed by an idle packet.
  data: p1=08 7E C4 12 00 3F; p2=08 7E C4 14 00 3F; p3=18 2A C0 07 00 09; idle=07 FF C0 00 00 03
  label: example
presets:
- name: Housekeeping packet
  settings:
    header: 087EC412003F
- name: Next packet (gap)
  settings:
    header: 087EC414003F
    previous_count: 1042
- name: Telecommand packet
  settings:
    header: 182AC0070009
- name: Idle packet
  settings:
    header: 07FFC0000003
break_it:
- Flip a version bit (the parser must reject the packet)
- Use the length field as the whole packet length
- Compare sequence counts across two different APIDs
steps:
- title: Read the fictional input
  instruction: Load the Housekeeping packet preset (08 7E C4 12 00 3F).
  expected: The header is split into octets 1–6 and the field diagram.
- title: Locate the APID
  instruction: Enter the 11-bit APID as hex.
  expected: '0x07E (126): the 11 bits after version, type and secondary header flag — not 0x087E.'
- title: Decode the sequence count
  instruction: Read flags and count, then load Next packet (sequence gap).
  expected: Flags 11, count 1042; the next packet shows 1044, so packet 1043 is missing on APID 126.
- title: Check the data length
  instruction: Read the length field and the computed total.
  expected: C = 63 → 64-octet data field → 70-octet packet; using 63 as the packet length lands 7 octets short of the next header.
  hint: Total = 6 + (C + 1).
- title: Compare with expected result
  instruction: Load the Telecommand and Idle presets, then turn on Inject error.
  expected: 'TC: type 1, APID 0x02A, count 7, 10-octet data field. Idle: APID all ones, secondary header 0. Version ≠ 000 is rejected with a warning.'
expected_result: The learner decodes headers, computes lengths correctly, and uses per-APID counts to report missing packets.
explanation: The header layout, length rule, count modulus and idle APID are fixed by CCSDS 133.0-B-2; APID meanings and secondary header contents are mission-defined.
common_mistakes:
- Forgetting the +1 and the 6-octet header
- Treating counts as global rather than per APID
- Counting idle packets as data
reset: Reset restores the housekeeping preset.
accessibility:
- All values and states are shown as text, not colour alone
- Every control is keyboard operable with visible focus; live results are announced politely
sources:
- id: CCSDS-133.0-B-2
  loc: §4.1.3, §4.1.4
- id: SANA-APID
  loc: registry
