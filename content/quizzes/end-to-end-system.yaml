id: end-to-end-system
topic: end-to-end-system
items:
- id: order
  type: single-choice
  prompt: Put the downlink journey of a temperature reading in order.
  choices:
  - text: Packet → frame → coding and sync marker → radio carrier → ground station → network → mission control
    correct: true
  - text: Radio carrier → packet → frame → mission control → ground station
    correct: false
  - text: Frame → packet → ground station → radio carrier → mission control
    correct: false
  explanation: Software wraps the reading in a packet, packets go into frames, frames are coded and marked, then modulated; the station recovers frames and the network delivers them to mission control.
  label: standard
  sources:
  - id: CCSDS-130.0-G-4
    loc: §3.2.1, §4.2
- id: meaning
  type: single-choice
  prompt: Who usually turns raw telemetry numbers into engineering values like "21.4 °C"?
  choices:
  - text: Software at mission control, using the mission's telemetry database
    correct: true
  - text: The ground station's receiver
    correct: false
  - text: The radio transmitter on the spacecraft
    correct: false
  explanation: Stations usually stop at frames; packet extraction and calibration happen in the mission's ground software.
  label: practice
  sources:
  - id: CCSDS-660.0-B-2
    loc: §6.1.2.1
- id: aos
  type: single-choice
  prompt: An operator says "AOS at 10:02". What do they mean?
  choices:
  - text: The pass started — the station acquired the spacecraft's signal
    correct: true
  - text: Advanced Orbiting Systems frames were enabled
    correct: false
  - text: The attitude system switched on
    correct: false
  explanation: In pass talk AOS is Acquisition of Signal. The AOS frame protocol is a different meaning of the same letters.
  label: practice
  sources:
  - id: NASA-SOA-11
    loc: §11.4
- id: stale
  type: single-choice
  prompt: Frame counts on VC0 keep rising but one parameter display is stale. Where is the fault most likely?
  choices:
  - text: 'After frame recovery: packet extraction, the source application or the database'
    correct: true
  - text: The RF link
    correct: false
  - text: The ground antenna
    correct: false
  explanation: Frames are arriving, so the link and station work; look above the frame layer.
  label: example
