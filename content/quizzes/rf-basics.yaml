id: rf-basics
topic: rf-basics
items:
- id: pol
  type: single-choice
  prompt: Which polarization does CCSDS recommend on Earth-to-space links?
  choices:
  - text: Circular
    correct: true
  - text: Linear horizontal
    correct: false
  - text: Linear vertical
    correct: false
  explanation: 401.0-B-32 recommends circular polarization on Earth-to-space links (RCP or LCP on space-to-Earth).
  label: standard
  sources:
  - id: CCSDS-401
    loc: §2.1.2, §2.3.5
- id: carrier
  type: single-choice
  prompt: What is the carrier?
  choices:
  - text: A steady radio wave at a known frequency that data is written onto by modulation
    correct: true
  - text: The company that operates the ground station
    correct: false
  - text: The error-correcting code added to frames
    correct: false
  explanation: On its own the carrier carries no information; modulation changes its phase, frequency or amplitude in a known pattern.
  label: practice
  sources:
  - id: NASA-BSF-10
    loc: Modulation and Demodulation, Carrier and Subcarrier
- id: dish
  type: single-choice
  prompt: Why does a bigger ground dish help receive a faint spacecraft?
  choices:
  - text: It collects and focuses more of the signal (higher gain), at the cost of needing more accurate pointing
    correct: true
  - text: It makes the spacecraft transmit more power
    correct: false
  - text: It removes the free-space loss
    correct: false
  explanation: Gain comes from focusing; the narrower beam must be pointed more precisely. Free-space loss is unchanged.
  label: practice
  sources:
  - id: NASA-BSF-10
    loc: Signal Power
- id: lowel
  type: single-choice
  prompt: Errors appear only in the first and last minute of every pass. What is the most likely explanation?
  choices:
  - text: Low elevation — longer path and more atmosphere reduce the margin
    correct: true
  - text: The spacecraft's software crashes at the start and end of each pass
    correct: false
  - text: The wrong polarization is configured
    correct: false
  explanation: A configuration error would affect the whole pass; edge-of-pass errors point at margin falling at low elevation.
  label: example
