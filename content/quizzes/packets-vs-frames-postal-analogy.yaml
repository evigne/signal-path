id: packets-vs-frames-postal-analogy
topic: packets-vs-frames-postal-analogy
items:
- id: which
  type: single-choice
  prompt: In the postal analogy, which is the fixed-size shipping container?
  choices:
  - text: The transfer frame
    correct: true
  - text: The Space Packet
    correct: false
  - text: The APID
    correct: false
  explanation: TM transfer frames have a constant length on a physical channel; packets vary in length and are packed inside frames.
  label: standard
  sources:
  - id: CCSDS-132.0-B-3
    loc: §4.1.1
- id: apid
  type: single-choice
  prompt: What does a packet's APID tell the ground?
  choices:
  - text: Which onboard application produced the packet
    correct: true
  - text: Which ground station should receive the packet
    correct: false
  - text: Where the packet starts inside the frame
    correct: false
  explanation: The APID names the source application process; it is not a destination address. Where a packet starts is the First Header Pointer's job.
  label: standard
  sources:
  - id: CCSDS-133.0-B-2
    loc: §4.1.3.3
- id: spill
  type: numeric
  prompt: Frames have a 1 000-octet data field. Packets of 600 and 700 octets are packed back to back from the start of frame 1. At which octet does the first packet that *starts* in frame 2 begin (the First Header Pointer)?
  answer:
    value: 300
    tolerance: 0
    unit: octet
  explanation: Frame 1 holds the 600-octet packet and the first 400 octets of the 700-octet one. Frame 2 begins with the remaining 300 octets, so the next packet starts at octet 300.
  label: example
- id: idle
  type: single-choice
  prompt: The frame is due but no packets are waiting. What happens?
  choices:
  - text: The frame is filled with idle data so the steady stream continues
    correct: true
  - text: The transmitter switches off until a packet arrives
    correct: false
  - text: The previous frame is sent again
    correct: false
  explanation: The downlink keeps its steady beat of frames; idle packets or idle-only frames fill the gap.
  label: standard
  sources:
  - id: CCSDS-132.0-B-3
    loc: §4.1.2.7.6
