id: space-packet-protocol
topic: space-packet-protocol
items:
- id: hdr
  type: decode
  prompt: Decode this fictional Space Packet primary header.
  data: 08 7E C4 12 00 3F
  answer:
    fields:
      type: 0
      sec_hdr: 1
      APID: 126
      seq_flags: 3
      seq_count: 1042
      total_octets: 70
  explanation: APID = bits 5–15 = 0x07E; count 1042; length 63 → 64-octet data field → 70 octets.
  label: example
  sources:
  - id: CCSDS-133.0-B-2
    loc: §4.1.3
- id: len
  type: numeric
  prompt: The Packet Data Length field is 9. How long is the whole packet, in octets?
  answer:
    value: 16
    tolerance: 0
    unit: octets
  explanation: 6-octet header + (9 + 1) = 16.
  label: standard
  sources:
  - id: CCSDS-133.0-B-2
    loc: §4.1.3.5
- id: idle
  type: single-choice
  prompt: Which APID marks an Idle Packet?
  choices:
  - text: All ones (2047)
    correct: true
  - text: All zeros (0)
    correct: false
  - text: '0x07E'
    correct: false
  explanation: All-ones is the only reserved APID.
  label: standard
  sources:
  - id: CCSDS-133.0-B-2
    loc: §4.1.3.3.4.4
