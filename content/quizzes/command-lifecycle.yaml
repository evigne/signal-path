id: command-lifecycle
topic: command-lifecycle
items:
- id: farm
  type: single-choice
  prompt: Which FARM-1 state rejects all Type-A frames until an Unlock?
  choices:
  - text: Lockout
    correct: true
  - text: Wait
    correct: false
  - text: Open
    correct: false
  explanation: Lockout is entered on an out-of-window N(S) and is left only on an Unlock control command.
  label: standard
  sources:
  - id: CCSDS-232.1-B-2
    loc: §6.1.2
- id: bypass
  type: single-choice
  prompt: What does Bypass Flag = 1 mean?
  choices:
  - text: 'Type-B: FARM acceptance checks are bypassed'
    correct: true
  - text: 'Type-A: sequence-controlled'
    correct: false
  - text: The frame carries a control command
    correct: false
  explanation: Bypass 1 = Type-B; the Control Command flag separately marks Type-C.
  label: standard
  sources:
  - id: CCSDS-232.0-B-4
    loc: §4.1.2.3
- id: verifier
  type: single-choice
  prompt: Which is NOT one of the eight XTCE verifier stages?
  choices:
  - text: Encrypted
    correct: true
  - text: Accepted
    correct: false
  - text: Complete
    correct: false
  explanation: The stages are TransferredToRange, TransferredFromRange, Received, Accepted, Queued, Execution, Complete and Failed.
  label: standard
  sources:
  - id: CCSDS-660.0-B-2
    loc: §6.1.3.2.8
